<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Frostbreaker Marketing">
  <title>Frostbreaker Marketing</title>
  <!--
    DAS BROWSERSYMBOL. Die Bildmarke von Frostbreaker: ein f im abgerundeten
    Quadrat, als Pfad gezeichnet und nicht als Text, damit es auf jedem Geraet
    gleich aussieht und keine Systemschrift braucht.

    HIER STAND BIS ZUM 2026-08-31 ETWAS ANDERES: ein dunkles Quadrat mit einem
    orangen Zickzack, ein Diagramm. Das gehoerte zur verworfenen Fassung, die
    sich als Pruefbericht verstand, und passte weder zur Marke noch zum
    Angebot. Der Nutzer hat es im Browsertab bemerkt.

    Uebernommen aus Frostbreaker_Website/marke/frostbreaker-marke.svg, damit
    marketing.frostbreaker.app und frostbreaker.app im Tab dasselbe Zeichen
    tragen. Wer eines aendert, aendert beide.

    KEIN VIEWBOX AUF 32: die Geometrie bleibt bei 512, der Browser
    verkleinert. Umgerechnete Koordinaten waeren gerundet und der Buchstabe
    saesse bei 16px sichtbar schief.
  -->
  <rect width="512" height="512" rx="118" fill="#0284C7"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="butt">
    <path d="M 262 400 V 228 A 74 74 0 0 1 336 154"/>
    <path d="M 182 252 H 342"/>
  </g>
</svg>
